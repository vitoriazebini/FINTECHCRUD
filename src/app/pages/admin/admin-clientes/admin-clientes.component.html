<div class="content-container">

    <div class="cabecalho">
        <div>
            <span class="subtitulo">
                ÁREA ADMINISTRATIVA
            </span>
            <h1>Clientes</h1>
            <p>
                Gerencie os clientes cadastrados na plataforma.
            </p>
        </div>

        <button class="botao-novo" type="button" routerLink="/cliente-cadastro">
            + Novo cliente
        </button>

    </div>
    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Sobrenome</th>
                    <th>Data de Nascimento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>

                @for (cliente of listaClientes; track cliente.id) {
                <tr>
                    <td>{{ cliente.id }}</td>
                    <td>{{ cliente.nome }}</td>
                    <td>{{ cliente.sobrenome }}</td>
                    <td>{{ cliente.dataNascimento }}</td>

                    <td class="acoes">

                        <button class="botao-editar" type="button" (click)="editar(cliente.id!)">
                            Editar
                        </button>

                        <button class="botao-excluir" type="button" (click)="excluir(cliente.id!)">
                            Excluir
                        </button>

                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
